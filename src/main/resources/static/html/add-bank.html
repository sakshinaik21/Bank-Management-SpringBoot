<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Bankify | Add Bank</title><link rel="stylesheet" href="../css/forms.css"></head>
<body>
<main class="form-page"><a href="banks.html">← Back to Banks</a><h1>Add New Bank</h1><p>Enter bank and branch details.</p>
<form id="bankForm">
<label>Bank Name<input id="bankName" required></label>
<label>IFSC Code<input id="ifsc" required></label>
<label>Branch Name<input id="branchName" required></label>
<label>Contact Number<input id="contact" required></label>
<h3>Address</h3>
<label>Street<input id="street" required></label><label>City<input id="city" required></label>
<label>State<input id="state" required></label><label>Pincode<input id="pincode" required></label>
<button type="submit">Create Bank</button>
</form></main><script src="../js/bank-form.js"></script></body></html>
