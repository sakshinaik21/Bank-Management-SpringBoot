<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bankify | Login</title>
<link rel="stylesheet" href="../css/login.css">
</head>
<body>
<div class="login-page">
    <div class="login-card">
        <div class="brand">Bank<span>ify</span></div>
        <p class="tagline">Smart banking, made simple.</p>
        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to access your banking dashboard.</p>
        <form id="loginForm">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
            <div class="form-row">
                <label class="remember"><input type="checkbox"> Remember me</label>
                <a href="#">Forgot password?</a>
            </div>
            <button type="submit">Sign In</button>
        </form>
        <p class="footer-text">Secure access to your Bankify account</p>
    </div>
</div>
<script src="../js/login.js"></script>
</body>
</html>
