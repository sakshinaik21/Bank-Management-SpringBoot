<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bankify AI Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .chat-container {
            width: 400px;
            margin: 50px auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        .chat-header {
            background: #1f4e79;
            color: white;
            padding: 18px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .chat-box {
            height: 400px;
            padding: 15px;
            overflow-y: auto;
        }

        .message {
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            max-width: 80%;
        }

        .user {
            background: #dbeafe;
            margin-left: auto;
            text-align: right;
        }

        .bot {
            background: #eeeeee;
            margin-right: auto;
        }

        .input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
        }

        .input-area input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .input-area button {
            margin-left: 8px;
            padding: 10px 15px;
            background: #1f4e79;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="chat-container">

    <div class="chat-header">
        🤖 Bankify AI Assistant
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message bot">
            Hello! I'm Bankify AI Assistant. How can I help you?
        </div>
    </div>

    <div class="input-area">
        <input
            type="text"
            id="question"
            placeholder="Ask something..."
        >

        <button onclick="askAI()">Send</button>
    </div>

</div>

<script>
    async function askAI() {

        const input = document.getElementById("question");
        const chatBox = document.getElementById("chatBox");

        const question = input.value.trim();

        if (question === "") {
            return;
        }

        // Show user message
        chatBox.innerHTML += `
            <div class="message user">
                ${question}
            </div>
        `;

        input.value = "";

        try {

            const response = await fetch("http://localhost:8080/api/ai/ask", {
                method: "POST",
                headers: {
                    "Content-Type": "text/plain"
                },
                body: question
            });

            const answer = await response.text();

            if (response.ok) {
                chatBox.innerHTML += `
                    <div class="message bot">
                        ${answer}
                    </div>
                `;
            } else {
                chatBox.innerHTML += `
                    <div class="message bot">
                        AI service is currently unavailable. Please try again later.
                    </div>
                `;
            }

        } catch (error) {

            chatBox.innerHTML += `
                <div class="message bot">
                    Unable to connect to AI service.
                </div>
            `;
        }

        chatBox.scrollTop = chatBox.scrollHeight;
    }
    
    
</script>

</body>
</html>
